name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Public content disclosure gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/publication-policy"
          rustc --edition=2021 -D warnings tools/publication-policy.rs -o "$guard"
          rustc --edition=2021 --test -D warnings tools/publication-policy.rs -o "$guard-tests"
          "$guard-tests"
          base="${BEFORE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git cat-file -e "$base"
          git diff --no-renames --name-only --diff-filter=AM -z "$base" HEAD \
            -- _posts assets/img/posts _data > "$RUNNER_TEMP/publication-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|*.svg|*.html|*.json|*.yml|*.yaml) "$guard" "$path" ;;
            esac
          done < "$RUNNER_TEMP/publication-paths"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Reader regression gates
        run: |
          bundle exec ruby tools/reader-check.rb
          bundle exec ruby tools/reader-tables-check.rb
          bundle exec ruby tools/visual-reader-check.rb
          bundle exec ruby tools/reader-republication-static.rb "_site${{ steps.pages.outputs.base_path }}"
          bundle exec ruby tools/visual-render-check.rb "_site${{ steps.pages.outputs.base_path }}"
          node --check assets/js/reader.js
          node --check assets/js/reader-visuals.js
          node --check tools/reader-republication-check.js
          node tools/visual-reader-js-check.cjs
          bash -n tools/reader-republication.sh

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
