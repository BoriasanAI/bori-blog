<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1628" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0d2137" stop-opacity="1"/>
      <stop offset="100%" stop-color="#071018" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg-grad)"/>
  <g id="grid" opacity="0.15">
    <circle cx="400" cy="400" r="52.0" fill="none" stroke="#48cfad" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="104.0" fill="none" stroke="#48cfad" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="156.0" fill="none" stroke="#48cfad" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="208.0" fill="none" stroke="#48cfad" stroke-width="0.5"/>
    <circle cx="400" cy="400" r="260.0" fill="none" stroke="#48cfad" stroke-width="0.5"/>
  </g>
  <g id="axes" opacity="0.2">
    <line x1="400" y1="400" x2="400.0" y2="140.0" stroke="#48cfad" stroke-width="0.5"/>
  </g>
  <g id="data" filter="url(#glow)">
    <polygon points="400.0,270.0" fill="rgba(72,207,173,0.12)" stroke="#48cfad" stroke-width="2" opacity="0.9"/>
    <circle cx="400.0" cy="270.0" r="4" fill="#48cfad" opacity="0.9"/>
    <circle cx="400.0" cy="270.0" r="9" fill="#48cfad" opacity="0.2"/>
  </g>
  <g id="labels">
    <text x="400.0" y="104.0" text-anchor="middle" dominant-baseline="central" dy="0em" fill="#48cfad" font-family="monospace" font-size="11" font-weight="600" opacity="0.85">PE</text>
    <text x="400.0" y="118.0" text-anchor="middle" fill="white" font-family="monospace" font-size="9.5" opacity="0.5">0.50</text>
  </g>
  <g id="core" filter="url(#soft-glow)">
    <circle cx="400" cy="400" r="18" fill="#48cfad" opacity="0.15"/>
    <circle cx="400" cy="400" r="8" fill="white" opacity="0.3"/>
    <circle cx="400" cy="400" r="3" fill="white" opacity="0.6"/>
  </g>
  <text x="400" y="770" text-anchor="middle" fill="white" font-family="'Courier New', monospace" font-size="13" opacity="0.4">On the Nature of Prophase</text>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#vignette)"/>
</svg>