            - generic [ref=e79]:
              - heading "Overview" [level=2] [ref=e80]
              - paragraph [ref=e81]: "SUREON is presented as two linked resources built from the same four-stage pipeline: SUREON-DB, a large automatically labeled training set of 76,061 video QA pairs spanning 168 procedure types and 10 surgical specialties, and the SUREON benchmark, a smaller 340-item surgeon-verified evaluation set covering 69 procedure types across 8 specialties."
              - paragraph [ref=e82]:
                - link "§3/Dataset Construction" [ref=e83] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S3.SS1
              - paragraph [ref=e84]: Alongside the benchmark, the authors release SUREON-VLM, a fine-tuned baseline model trained on the curated SUREON data; the paper reports that it avoids common language-only shortcuts, outperforms other open-source surgical models on the SUREON benchmark, and performs comparably to larger specialist models on separate public surgical benchmarks.
              - paragraph [ref=e85]:
                - link "Abstract" [ref=e86] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2
              - paragraph [ref=e87]: Because SUREON is built from the SurgLaVi-β lecture corpus, which is licensed CC BY-NC-SA 4.0, the authors release both SUREON-DB and the SUREON benchmark under the same non-commercial, share-alike license; only the derived QA annotations, timestamps and metadata are distributed, not the underlying lecture videos.
              - paragraph [ref=e88]:
                - link "Appendix F/Ethics" [ref=e89] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A6
              - heading "Problem and context" [level=2] [ref=e90]
              - paragraph [ref=e91]: The paper’s motivating critique is that many existing surgical video-QA benchmarks can be answered correctly without ever viewing the video, because models can exploit generic procedural priors or common anatomy-instrument co-occurrence patterns rather than actually grounding answers in the visual scene.
              - paragraph [ref=e92]:
                - link "Abstract" [ref=e93] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2
              - paragraph [ref=e94]: "The authors argue that standard benchmark-construction workflows in surgery are circular: the same general-purpose multimodal models that perform poorly on surgical visual tasks would otherwise be used to generate and grade the benchmark, so a model ‘cannot grade an exam it would fail itself,’ while routing every item through human surgeons alone does not scale."
              - paragraph [ref=e95]:
                - link "§1/Introduction" [ref=e96] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S1.p4
              - paragraph [ref=e97]: The paper frames the cost of skipping visual-dependence verification by citing prior general-domain findings that large fractions of popular multimodal benchmarks are solvable by text-only models, using this precedent to justify why SUREON needs an explicit filtering step rather than relying on naively generated LLM QA.
              - paragraph [ref=e98]:
                - link "§1/Introduction" [ref=e99] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S1.p4
              - heading "Method" [level=2] [ref=e100]
              - paragraph [ref=e101]: Stage 1 of the SUREON pipeline uses category-specialized generator-validator agent pairs, one per semantic question category, following a ‘divide and conquer’ approach to agentic data synthesis in which role specialization is reported to produce higher-quality data than prompting a single general-purpose LLM.
              - paragraph [ref=e102]:
                - link "Appendix B.2/Stage 1" [ref=e103] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS2
              - paragraph [ref=e104]: "Stage 2 introduces Retrieval-Augmented Distractor Generation (RADG): correct answers from the training set are pooled per question category and embedded, and new distractors are generated conditioned on retrieved same-category answer exemplars, intended to close the stylistic and length gap that otherwise lets models spot the correct option without watching the video."
              - paragraph [ref=e105]:
                - link "Appendix B.3.1/RADG" [ref=e106] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS3.SSS1
              - paragraph [ref=e107]: To further reduce single-model artifacts, three separate distractor-generator LLMs each produce multiple candidate distractors, and the final distractor set for each question is drawn at random from the combined multi-model candidate pool rather than from any single generator, which the paper reports reduces exploitable shortcut patterns.
              - paragraph [ref=e108]:
                - 'link "§3.1/Stage 2: Multi-model Mixing" [ref=e109] [cursor=pointer]':
                  - /url: https://arxiv.org/html/2603.06570v2#S3.SS1.SSSx2
              - paragraph [ref=e110]: "Stage 3 applies blind-test curation: an ensemble of LLM/VLM ‘guessers,’ including both off-the-shelf and fine-tuned models, is asked to answer each question from text alone with no video access; any item the guessers solve consistently across repeated trials is treated as not requiring visual evidence and is discarded."
              - paragraph [ref=e111]:
                - 'link "§3.1/Stage 3: Blind-Test Curation" [ref=e112] [cursor=pointer]':
                  - /url: https://arxiv.org/html/2603.06570v2#S3.SS1.SSSx3
              - paragraph [ref=e113]: For the benchmark-verification subset in Stage 4, surviving candidates are checked by expert surgeons, but the primary protocol assigns a single reviewer per item rather than double-coding every sample; the authors justify this because each candidate question is already transcript-grounded in a surgeon’s own narration, making verification a confirmation step rather than open-ended annotation from scratch.
              - paragraph [ref=e114]:
                - link "Appendix B.5.2/Reviewer Panel" [ref=e115] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS5.SSS2
              - heading "Data and curation" [level=2] [ref=e116]
              - paragraph [ref=e117]: SUREON is built on the SurgLaVi-β corpus of narrated surgical lecture videos; the authors performed a stratified, subject-balanced split at the video level, holding out roughly 10% of videos for validation, yielding 2,809 training videos and 339 validation videos with no video shared across the two splits.
              - paragraph [ref=e118]:
                - link "Appendix B.1/Data Source" [ref=e119] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS1
              - paragraph [ref=e120]: "A summary table contrasts the two released resources: 76,061 QA pairs versus 340 benchmark items; both share the same 10 question categories split 7 short-window/3 long-horizon and 8 multiple-choice/2 open-ended, but differ in specialties (10 vs 8), procedure types (168 vs 69), subjects (37 vs 27), and labeling method (automatic pseudo-labels vs expert-verified)."
              - paragraph [ref=e121]:
                - link "§3/Table 2" [ref=e122] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S3.T2
              - paragraph [ref=e123]: Each multiple-choice item in SUREON carries six distractors alongside the correct answer, seven options total, selected at random from an 18-candidate pool assembled from three different distractor-generating LLMs; the paper reports this six-distractor configuration was chosen because it pushed blind-guesser accuracy closest to random chance in internal tests.
              - paragraph [ref=e124]:
                - link "Appendix B.6/Final Dataset Configuration" [ref=e125] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS6
              - paragraph [ref=e126]: Across all ten question categories combined, expert reviewers examined 602 candidate items for the benchmark, approved 340 of them, and rejected 262, for an overall approval rate of 56.5%; category-level approval rates in the underlying table range much more widely across individual categories.
              - paragraph [ref=e127]:
                - link "Appendix B.5.2/Table 12" [ref=e128] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.T12
              - paragraph [ref=e129]: For the subset of rejected items where reviewers gave a reason (178 of 262), the most common causes were that the question was ambiguous or had more than one plausible correct answer (22.5%), that the marked answer was judged inaccurate (14.6%), followed by insufficient context (9.6%) and content not actually visible in the clip (9.6%).
              - paragraph [ref=e130]:
                - link "Appendix B.5.2/Table 12" [ref=e131] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.T12
              - paragraph [ref=e132]: To gauge reliability of the single-reviewer protocol, a separate 74-item subset was independently reviewed by two surgeons drawn from a 5-person pool covering every possible reviewer pair; the two raters agreed on the approve/reject decision for 52 of 74 items, 70.3% raw agreement, and the entire verification effort consumed roughly 32 cumulative surgeon-hours.
              - paragraph [ref=e133]:
                - link "Appendix B.5.2/Reviewer Panel" [ref=e134] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS5.SSS2
              - heading "Evaluation design" [level=2] [ref=e135]
              - paragraph [ref=e136]: Model performance is reported mainly as plain accuracy on eight multiple-choice-style categories plus exact-match scoring for temporal ordering; the paper also defines a separate ‘multimodal gain’ (MG) metric, computed as a model’s accuracy with video input minus that same model’s accuracy when forced to answer blind, text only.
              - paragraph [ref=e137]:
                - link "§4/Experiments" [ref=e138] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4
              - paragraph [ref=e139]: Statistical comparisons between models use non-parametric bootstrap confidence intervals cross-checked against analytic Wilson-score intervals, and pairwise model-vs-model differences are tested with McNemar’s test corrected for multiple comparisons (Holm-Bonferroni) across all 66 possible pairs among the 11 evaluated models plus the human baseline.
              - paragraph [ref=e140]:
                - link "Appendix D.1" [ref=e141] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A4.SS1
              - paragraph [ref=e142]: The paper’s main accuracy table pools results over 299 of the 340 benchmark items, the eight multiple-choice categories plus exact-match temporal ordering; the open-ended ‘sequence summarization’ category, scored separately by an LLM judge rather than exact accuracy, is excluded from this 299-item pooled figure.
              - paragraph [ref=e143]:
                - link "Appendix D.1/Table 14" [ref=e144] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A4.T14
              - paragraph [ref=e145]: A separate supplementary table further splits the same 299 accuracy-scored items into a 166-item ‘perception’ subset and a 133-item ‘reasoning’ subset; in that split, Gemini 3.1 Pro’s perception-only accuracy is reported as 53.0%, a figure sitting almost exactly at the ‘53%’ threshold quoted in the abstract, distinct from its overall pooled accuracy of 52.2%.
              - paragraph [ref=e146]:
                - link "Appendix D.1/Table 15" [ref=e147] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A4.T15
              - paragraph [ref=e148]: "The human-expert baseline’s 64.9% overall accuracy conceals substantial category-level spread: surgeons were reported near ceiling (96.5%) on one descriptive category while scoring much lower on categories requiring inference about the purpose of an observed action, illustrating that the single aggregate figure is not uniform across task types."
              - paragraph [ref=e149]:
                - link "§4/Experiments" [ref=e150] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4
              - heading "Results" [level=2] [ref=e151]
              - paragraph [ref=e152]: The abstract’s headline claim is that ‘no model exceeds 53% accuracy and even expert surgeons reach only 64.9%,’ which the paper uses to argue that visually grounded surgical reasoning remains far from solved despite testing both commercial and open-source systems.
              - paragraph [ref=e153]:
                - link "Abstract" [ref=e154] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2
              - paragraph [ref=e155]: "The construction-pipeline ablation trains the same model type on data from successive pipeline stages and evaluates each checkpoint under the same fixed SUREON evaluation protocol: multimodal gain rises from 8.7 (raw Stage-1 data, Table 4’s rounded 176.6K training samples) to 16.8 (after distractor refinement, same 176.6K) to 29.1 (after blind-test curation, which cuts the training set to Table 4’s rounded 76K — distinct from, though consistent with, the exact 76,061 QA pairs documented for the released SUREON-DB in §3/Table 2)."
              - paragraph [ref=e156]:
                - link "§4/Table 4" [ref=e157] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.T4
                - text: ·
                - link "§3/Dataset Construction" [ref=e158] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S3.SS1
              - paragraph [ref=e159]: A separate data-composition ablation shows training on public surgical datasets alone reaches 20.7% accuracy with a multimodal gain of 8.7, training on SUREON-DB alone reaches 44.1% accuracy with a gain of 22.1, and combining both sources (the full SUREON-VLM) reaches 48.2% accuracy with a gain of 29.1; the paper reports that both the SUREON-only and the combined settings significantly outperform the public-only setting after correcting for multiple comparisons.
              - paragraph [ref=e160]:
                - link "§4/Table 3" [ref=e161] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.T3
              - paragraph [ref=e162]: On separately published public surgical benchmarks, the paper reports that the released SUREON-VLM model, despite using a comparatively small 8-billion-parameter backbone, matches or exceeds several larger specialist models on Cholec80 phase recognition and the Endoscapes Critical-View-of-Safety task, while performing noticeably worse than a specialist model on HeiChole action recognition.
              - paragraph [ref=e163]:
                - link "§4/Table 5" [ref=e164] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.T5
              - paragraph [ref=e165]: "A training-recipe ablation reports that fine-tuning on only one data source degrades other capabilities relative to the untrained base model: public-image-only training raises grounding scores but lowers SUREON accuracy below the untuned baseline, while SUREON-only training raises SUREON accuracy but lowers an unrelated tool-localization benchmark score below that same untuned baseline."
              - paragraph [ref=e166]:
                - link "Appendix E/Table 19" [ref=e167] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A5
              - 'heading "Curation ablation: reported size and visual grounding" [level=3] [ref=e168]'
