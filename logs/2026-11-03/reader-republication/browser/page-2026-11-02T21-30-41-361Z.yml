              - heading "Limitations" [level=2] [ref=e201]
              - paragraph [ref=e202]: The authors flag that their blind-test ‘guesser’ ensemble used to filter out non-visual questions is built from a single open-source model family used both off-the-shelf and fine-tuned, not from commercial systems, and they note that which exact samples get filtered out could change if a different or more capable guesser model family were used instead.
              - paragraph [ref=e203]:
                - link "Appendix A/Limitations" [ref=e204] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A1
              - paragraph [ref=e205]: "A second stated limitation is that refining only the multiple-choice distractors cannot fully close every shortcut: if a question’s own wording names the specific operative context or signals the procedural phase, that can still let a model guess correctly without needing the video, which the authors flag as unresolved by distractor-level filtering alone."
              - paragraph [ref=e206]:
                - link "Appendix A/Limitations" [ref=e207] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A1
              - paragraph [ref=e208]: Because every benchmark item is anchored to a moment the lecturer explicitly narrated, the authors acknowledge that visually salient surgical content the narrator chose not to describe out loud is systematically excluded from coverage, so the benchmark’s scope reflects what surgeons verbalize when teaching rather than everything visible in the footage.
              - paragraph [ref=e209]:
                - link "Appendix A/Limitations" [ref=e210] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A1
              - paragraph [ref=e211]: The authors state that, because source material is edited, narrated teaching video, the case mix likely over-represents typical textbook presentations relative to rarer anatomies or intraoperative complications, and separately caution that real intraoperative footage, uncut, without narration, degraded by smoke, blood and motion, differs enough that strong SUREON scores should not be read as evidence of readiness for live surgical settings.
              - paragraph [ref=e212]:
                - link "Appendix A/Limitations" [ref=e213] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A1
              - heading "Interpretation" [level=2] [ref=e214]
              - paragraph [ref=e215]:
                - emphasis [ref=e216]: Interpretation.
                - text: Reading the paper’s own ethics section alongside its limitations, SUREON’s reported accuracy numbers describe performance on a curated, edited-lecture question-answering task, not live intraoperative perception, surgical skill, or patient outcomes; the authors themselves state models trained on the automatically labeled SUREON-DB portion must not be used for clinical decision-making, a distinction any public-facing summary of this paper should preserve.
              - paragraph [ref=e217]:
                - link "Appendix F/Ethics" [ref=e218] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A6
              - paragraph [ref=e219]:
                - emphasis [ref=e220]: Interpretation.
                - text: "The abstract’s single claim that multimodal gain ‘increases from 8.7 to 29.1’ is supported by two separate ablations that happen to share the number 8.7: one compares pipeline construction stages on a fixed data source (Table 4, Stage 1 to Stage 3), the other compares training-data origin, public-only versus the combined public+SUREON-DB setting (Table 3) — not SUREON-DB alone, which reaches a smaller MG of 22.1. Summaries citing ‘8.7 to 29.1’ should specify which comparison is meant, since conflating them, or substituting SUREON-DB-only for the combined setting, risks an incorrect causal story."
              - paragraph [ref=e221]:
                - link "§4/Table 4" [ref=e222] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.T4
                - text: ·
                - link "§4/Table 3" [ref=e223] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.T3
              - paragraph [ref=e224]:
                - emphasis [ref=e225]: Interpretation.
                - text: "For precise reporting, I use the paper’s pooled result rather than a favorable subgroup: §4 names Gemini 3.1 Pro’s 52.2% accuracy on the 299-item pooled protocol as the highest numerical mean (Tables 3 and 14). This is consistent with the abstract’s statement that no model exceeds 53%, but does not mean every task subset scores below that threshold. Table 15 separately reports 53.0% on 166 perception items and 51.1% on 133 reasoning items. Those rounded subset scores are consistent with the pooled mean. Keeping the denominators and evaluation levels separate avoids presenting a narrower subgroup result as overall performance, and none of these research scores establishes clinical readiness."
              - paragraph [ref=e226]:
                - link "§4/Pooled results" [ref=e227] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#S4.p5
                - text: ·
                - link "Appendix D.1/Table 15" [ref=e228] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A4.T15
              - paragraph [ref=e229]:
                - emphasis [ref=e230]: Interpretation.
                - text: Because the primary verification protocol assigns only one surgeon per candidate item, with two-rater agreement measured only on a separate 74-item side-sample, 70.3% agreement, the phrase ‘340 questions verified by expert surgeons’ should be read as single-reviewer sign-off backed by a smaller reliability check, not as every item having been independently confirmed by multiple experts.
              - paragraph [ref=e231]:
                - link "Appendix B.5.2/Reviewer Panel" [ref=e232] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2603.06570v2#A2.SS5.SSS2
