  <text x="80" y="324" font-family="monospace" font-size="10" fill="#fda4af">2</text>
  <rect x="142" y="312" width="28" height="28" fill="#f43f5e"/>
  <text x="140" y="360" font-family="monospace" font-size="11" fill="#cbd5e1">n=4</text>
  <text x="142" y="304" font-family="monospace" font-size="10" fill="#fda4af">15</text>
