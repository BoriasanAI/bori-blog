<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img">
  <title>Figure 2: Combinatorial Bell Partition Scaling and Clinical Perturbational Complexity Index (PCI)</title>
  <rect width="800" height="440" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="376" height="408" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="408" y="16" width="376" height="408" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="34" y="48" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">A. Partition Growth log₁₀(B_n) vs Proxies</text>
  <text x="34" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8">Exact MIP (Bell number B_n) vs Polynomial Φ* / Φ_G</text>
  <line x1="64" y1="340" x2="360" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="64" y1="100" x2="64" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <rect x="82" y="333" width="28" height="7" fill="#f43f5e"/>
