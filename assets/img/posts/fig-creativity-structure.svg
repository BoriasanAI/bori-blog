<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img">
  <title>Figure 1: Five-Stage Closed-Loop Computational Model of Creativity and Novelty-Value Convergent Gate</title>
  <rect width="800" height="440" rx="14" fill="#0f172a"/>
  <text x="32" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">Figure 1. Five-Stage Closed-Loop Computational Architecture of Creativity</text>
  <text x="32" y="64" font-family="sans-serif" font-size="12" fill="#94a3b8">Coupling Divergent Exploration (G_θ), Convergent Novelty × Value Verification (E_φ), and Recursive Schema Updating (Φ_update)</text>
  <rect x="28" y="88" width="168" height="122" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="42" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">① Knowledge Base (K_t)</text>
  <text x="42" y="136" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Grounded Ontology V_t</text>
  <text x="42" y="156" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Relational Edges E_t</text>
  <text x="42" y="176" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Generative Rules R_t</text>
  <text x="42" y="196" font-family="monospace" font-size="10" fill="#7dd3fc">CHC Glr + Domain D</text>
  <line x1="196" y1="149" x2="224" y2="149" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="224,149 214,143 214,155" fill="#38bdf8"/>
  <rect x="226" y="88" width="168" height="122" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
  <text x="240" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#818cf8">② Associative Search (A)</text>
  <text x="240" y="136" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Distant-Hop Traversal</text>
  <text x="240" y="156" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Bisociation M_1 ∩ M_2</text>
  <text x="240" y="176" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Fixedness Suppression</text>
  <text x="240" y="196" font-family="monospace" font-size="10" fill="#a5b4fc">Implicit EII Spreading</text>
  <line x1="394" y1="149" x2="422" y2="149" stroke="#818cf8" stroke-width="2.5"/>
  <polygon points="422,149 412,143 412,155" fill="#818cf8"/>
  <rect x="424" y="88" width="168" height="122" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.8"/>
  <text x="438" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc">③ Generation (G_θ)</text>
  <text x="438" y="136" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Conceptual Blending</text>
  <text x="438" y="156" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Preinventive Forms</text>
  <text x="438" y="176" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Rule Perturbation Ψ</text>
  <text x="438" y="196" font-family="monospace" font-size="10" fill="#d8b4fe">Divergent Set H_t</text>
  <line x1="592" y1="149" x2="620" y2="149" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="620,149 610,143 610,155" fill="#c084fc"/>
  <rect x="622" y="88" width="150" height="122" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
  <text x="634" y="114" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">④ Evaluation (E_φ)</text>
  <text x="634" y="136" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Novelty N(y | K_t)</text>
  <text x="634" y="156" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Utility U(y | G)</text>
  <text x="634" y="176" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Coherence ≥ τ_coh</text>
  <text x="634" y="196" font-family="monospace" font-size="10" fill="#6ee7b7">Convergent Filter</text>
  <rect x="28" y="250" width="430" height="162" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="46" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">⑤ Feedback Learning, Honing &amp; Meta-Rule Consolidation (Φ_update)</text>
  <text x="46" y="302" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Compression Progress Reward: r_t^int = L_t(D) − L_{t+1}(D) &gt; 0 (Schmidhuber, 2010)</text>
  <text x="46" y="324" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Worldview Honing: W_{t+1} = Hone(W_t, y*, feedback) (Gabora, 2005)</text>
  <text x="46" y="346" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Tier 3 Meta-Rule Update: (R_{t+1}, E_{φ,t+1}) = Φ_meta(R_t, E_{φ,t}, ∇_R C)</text>
  <text x="46" y="372" font-family="monospace" font-size="11" fill="#fde68a">Closes loop to ①: K_{t+1} = (V_t ∪ {y*}, E_{t+1}, R_{t+1})</text>
  <path d="M 697 210 L 697 232 L 380 232 L 380 250" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="5,4"/>
  <path d="M 112 250 L 112 210" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="112,210 106,220 118,220" fill="#f59e0b"/>
  <rect x="478" y="250" width="294" height="162" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="494" y="278" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fda4af">Novelty × Value Boundary Regimes</text>
  <text x="494" y="304" font-family="monospace" font-size="11" fill="#94a3b8">Random Noise : N=0.96, U=0.05 → C=0.02 (Reject)</text>
  <text x="494" y="328" font-family="monospace" font-size="11" fill="#94a3b8">Rote Copy    : N=0.10, U=0.88 → C=0.09 (Reject)</text>
  <text x="494" y="352" font-family="monospace" font-size="11" fill="#6ee7b7">Tier 1–2 Syn : N=0.82, U=0.86 → C=0.78 (Retain)</text>
  <text x="494" y="376" font-family="monospace" font-size="11" fill="#38bdf8">Tier 3 Meta  : N=0.91, U=0.92 → C=0.89 (Evolve)</text>
  <text x="494" y="398" font-family="sans-serif" font-size="11" fill="#cbd5e1">C(y) = N(y|K_t)^α · U(y|G)^β · σ(Coh − τ_coh)</text>
</svg>
