<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img">
  <title>Structural Architecture of On the Structure of Learning</title>
  <rect width="800" height="420" rx="14" fill="#0f172a"/>
  <text x="40" y="48" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Conceptual Architecture: On the Structure of Learning</text>
  <rect x="40" y="84" width="330" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="116" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. Foundational Definition &amp; Axioms</text>
  <text x="60" y="144" font-family="sans-serif" font-size="13" fill="#cbd5e1">Isolates necessary predicates and boundary</text>
  <text x="60" y="166" font-family="sans-serif" font-size="13" fill="#cbd5e1">conditions from surface terminology.</text>
  <rect x="430" y="84" width="330" height="130" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="450" y="116" font-family="sans-serif" font-size="15" font-weight="bold" fill="#818cf8">2. Formal &amp; Causal Mechanisms</text>
  <text x="450" y="144" font-family="sans-serif" font-size="13" fill="#cbd5e1">Maps qualitative postulates onto state-space</text>
  <text x="450" y="166" font-family="sans-serif" font-size="13" fill="#cbd5e1">transitions and relational invariants.</text>
  <rect x="235" y="254" width="330" height="130" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="255" y="286" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">3. Empirical &amp; Computational Limits</text>
  <text x="255" y="314" font-family="sans-serif" font-size="13" fill="#cbd5e1">Evaluates falsifiability, scaling complexity,</text>
  <text x="255" y="336" font-family="sans-serif" font-size="13" fill="#cbd5e1">and tractable approximations.</text>
  <line x1="370" y1="149" x2="430" y2="149" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="595" y1="214" x2="450" y2="254" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="205" y1="214" x2="350" y2="254" stroke="#94a3b8" stroke-width="2.5"/>
</svg>
