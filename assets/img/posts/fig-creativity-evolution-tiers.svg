<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img">
  <title>Figure 2: Three-Tier Creative Evolution Hierarchy (Combinatorial, Transformational, Self-Evolving) and Six-Axis Evaluation</title>
  <rect width="800" height="440" rx="14" fill="#0f172a"/>
  <text x="32" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">Figure 2. Three-Tier Creative Evolution Hierarchy &amp; Quantitative Evaluation Profile</text>
  <text x="32" y="64" font-family="sans-serif" font-size="12" fill="#94a3b8">From Concept Combination (A ⊕ B → C) to Rule Transformation (R → R') and Self-Evolving Meta-Rule Synthesis (Φ_meta)</text>
  <rect x="28" y="86" width="420" height="102" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="44" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Tier 1: Combinatorial Creativity (A ⊕ B → C)</text>
  <text x="44" y="134" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Combines existing concepts within a fixed rule space S(R_0)</text>
  <text x="44" y="154" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Mechanism: Bisociation (Koestler) &amp; Conceptual Blending</text>
  <text x="44" y="174" font-family="monospace" font-size="11" fill="#7dd3fc">Invariant: R_{t+1} = R_t (Fixed generative grammar)</text>
  <rect x="28" y="202" width="420" height="102" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.6"/>
  <text x="44" y="228" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c084fc">Tier 2: Transformational Creativity (R_t → R_t')</text>
  <text x="44" y="250" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Alters or drops constitutive axioms of the conceptual space (Boden)</text>
  <text x="44" y="270" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Unlocks previously unreachable structures y ∈ S(R_t') \ S(R_t)</text>
  <text x="44" y="290" font-family="monospace" font-size="11" fill="#d8b4fe">Example: Euclidean → Non-Euclidean parallel postulate relaxation</text>
  <rect x="28" y="318" width="420" height="102" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="44" y="344" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">Tier 3: Self-Evolving Creativity (Φ_meta: R_t, E_t → R_{t+1}, E_{t+1})</text>
  <text x="44" y="366" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Synthesizes new rules, evaluates them via feedback, updates own mind</text>
  <text x="44" y="386" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Closes recursive AGI loop across representation &amp; problem-solving</text>
  <text x="44" y="406" font-family="monospace" font-size="11" fill="#6ee7b7">Autopoietic invariant: ΔC(H_{t+1}) &gt; 0 under external verification</text>
  <rect x="468" y="86" width="304" height="334" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="486" y="114" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Six-Axis Evaluation Profile (Tier 3)</text>
  <text x="486" y="136" font-family="sans-serif" font-size="11" fill="#94a3b8">Quantitative criteria preventing random-noise gaming</text>
  <text x="486" y="166" font-family="monospace" font-size="11" fill="#cbd5e1">1. Novelty      (0.91)</text>
  <rect x="632" y="155" width="118" height="12" rx="3" fill="#38bdf8"/>
  <text x="486" y="204" font-family="monospace" font-size="11" fill="#cbd5e1">2. Diversity    (0.88)</text>
  <rect x="632" y="193" width="114" height="12" rx="3" fill="#818cf8"/>
  <text x="486" y="242" font-family="monospace" font-size="11" fill="#cbd5e1">3. Usefulness   (0.92)</text>
  <rect x="632" y="231" width="120" height="12" rx="3" fill="#34d399"/>
  <text x="486" y="280" font-family="monospace" font-size="11" fill="#cbd5e1">4. Coherence    (0.94)</text>
  <rect x="632" y="269" width="122" height="12" rx="3" fill="#10b981"/>
  <text x="486" y="318" font-family="monospace" font-size="11" fill="#cbd5e1">5. Feasibility  (0.87)</text>
  <rect x="632" y="307" width="113" height="12" rx="3" fill="#f59e0b"/>
  <text x="486" y="356" font-family="monospace" font-size="11" fill="#cbd5e1">6. Adaptability (0.93)</text>
  <rect x="632" y="345" width="121" height="12" rx="3" fill="#c084fc"/>
  <text x="486" y="396" font-family="monospace" font-size="12" font-weight="bold" fill="#6ee7b7">Composite C(y*) = 0.8902 (Verified Pass)</text>
</svg>
