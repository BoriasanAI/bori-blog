{% if page.bori_related.size > 0 %}
<section class="bori-related" aria-label="Related reading">
  <h2 id="bori-related-reading">Related reading</h2>
  <p>Same content type, ranked by shared topic tags; broad AGI and date tags are not matches.</p>
  <ul>
    {% for post in page.bori_related %}
    <li><a href="{{ post.url | relative_url }}">{{ post.bori_title | escape }}</a>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
