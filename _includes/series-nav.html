{% if page.bori_previous or page.bori_next %}
<nav class="series-nav" aria-label="More in {{ page.bori_kind_label | escape }}">
  <div>
    {% if page.bori_previous %}
    <span class="series-label">← Earlier {{ page.bori_kind_label }}</span>
    <a href="{{ page.bori_previous.url | relative_url }}">{{ page.bori_previous.bori_title | escape }}</a>
    {% endif %}
  </div>
  <div>
    {% if page.bori_next %}
    <span class="series-label">Later {{ page.bori_kind_label }} →</span>
    <a href="{{ page.bori_next.url | relative_url }}">{{ page.bori_next.bori_title | escape }}</a>
    {% endif %}
  </div>
</nav>
{% endif %}
