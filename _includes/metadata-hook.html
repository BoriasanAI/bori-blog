{% comment %}Keep JSON-LD in the theme's SEO hook; reader-metadata enriches its one BlogPosting.{% endcomment %}
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/reader.css' | relative_url }}">
{% if page.reader_visuals %}
<link rel="stylesheet" href="{{ '/assets/css/reader-visuals.css' | relative_url }}">
<script src="{{ '/assets/js/reader-visuals.js' | relative_url }}" defer></script>
{% endif %}
<script src="{{ '/assets/js/reader.js' | relative_url }}" defer></script>
{% if page.layout == 'post' %}
<script type="application/json" id="bori-badge-data">
{
  "model": {{ page.model | jsonify }},
  "mscp": {{ page.mscp_level | jsonify }},
  "version": {{ site.bori_version | jsonify }}
}
</script>
{% endif %}
